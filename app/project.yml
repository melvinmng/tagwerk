name: Tagwerk
options:
  bundleIdPrefix: com.melvinmng.tagwerk
  developmentLanguage: de
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K44K4GXH9G
packages:
  TagwerkCore:
    path: Packages/TagwerkCore
  SecureStore:
    path: Packages/SecureStore
  RemindersKit:
    path: Packages/RemindersKit
  GitHubKit:
    path: Packages/GitHubKit
targets:
  Tagwerk:
    type: application
    platform: iOS
    sources: [Tagwerk]
    dependencies:
      - package: TagwerkCore
      - package: SecureStore
      - package: RemindersKit
      - package: GitHubKit
    configFiles:
      Debug: Config/GitHub.xcconfig
      Release: Config/GitHub.xcconfig
    info:
      path: Tagwerk/Info.plist
      properties:
        CFBundleDisplayName: Tagwerk
        UILaunchScreen: {}
        NSRemindersFullAccessUsageDescription: "Tagwerk liest und bearbeitet deine Erinnerungen, um sie mit deinen anderen Aufgaben zusammenzuführen."
        NSCalendarsFullAccessUsageDescription: "Tagwerk liest deinen Kalender, um deinen Tag zu planen."
        GitHubClientID: $(GITHUB_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melvinmng.tagwerk
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TagwerkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TagwerkTests]
    dependencies:
      - target: Tagwerk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.melvinmng.tagwerk.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tagwerk.app/Tagwerk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tagwerk:
    build:
      targets:
        Tagwerk: all
        TagwerkTests: [test]
    test:
      targets: [TagwerkTests]
