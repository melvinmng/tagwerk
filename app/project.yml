name: Tagwerk
options:
  bundleIdPrefix: local.tagwerk
  developmentLanguage: de
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    TAGWERK_BUNDLE_ID: local.tagwerk.app
    GITHUB_CLIENT_ID: ""
packages:
  TagwerkCore:
    path: Packages/TagwerkCore
  SecureStore:
    path: Packages/SecureStore
  RemindersKit:
    path: Packages/RemindersKit
  GitHubKit:
    path: Packages/GitHubKit
  AIKit:
    path: Packages/AIKit
  HealthBridge:
    path: Packages/HealthBridge
targets:
  Tagwerk:
    type: application
    platform: iOS
    sources:
      - Tagwerk
      - Design/Colors.xcassets
    dependencies:
      - package: TagwerkCore
      - package: SecureStore
      - package: RemindersKit
      - package: GitHubKit
      - package: AIKit
      - package: HealthBridge
      - target: TagwerkWidget
      - target: TagwerkShare
    entitlements:
      path: Tagwerk/Tagwerk.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.$(TAGWERK_BUNDLE_ID)]
    info:
      path: Tagwerk/Info.plist
      properties:
        CFBundleDisplayName: Tagwerk
        UILaunchScreen: {}
        NSRemindersFullAccessUsageDescription: "Tagwerk liest und bearbeitet deine Erinnerungen, um sie mit deinen anderen Aufgaben zusammenzuführen."
        NSCalendarsFullAccessUsageDescription: "Tagwerk liest deinen Kalender, um deinen Tag zu planen."
        NSHealthShareUsageDescription: "Tagwerk zeigt deine Trainings, Schritte, Aktivitätsenergie, dein Gewicht und deine Körperdaten aus Health im Tab „Erfassen“ und liest auf Wunsch Ernährungseinträge anderer Apps."
        NSHealthUpdateUsageDescription: "Tagwerk speichert deine Mahlzeiten mit ihren Nährwerten, dein Wasser, deine Trainings und dein Gewicht in Health."
        NSMicrophoneUsageDescription: "Tagwerk wandelt deine Sprache auf dem iPhone in Text um. Der Ton verlässt das Gerät nicht."
        NSFaceIDUsageDescription: "Tagwerk entsperrt damit gesperrte Notizen und private Ordner."
        NSCameraUsageDescription: "Tagwerk nimmt Fotos von Mahlzeiten auf, um Kalorien und Nährwerte schätzen zu lassen, liest Strichcodes von Lebensmitteln und nimmt Fotos auf, die du an eine Notiz anhängst."
        GitHubClientID: $(GITHUB_CLIENT_ID)
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: de.tagwerk.backup
            UTTypeDescription: Tagwerk-Sicherung
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [tagwerk]
              public.mime-type: application/x-tagwerk-backup
        CFBundleURLTypes:
          - CFBundleURLName: $(TAGWERK_BUNDLE_ID)
            CFBundleURLSchemes: [tagwerk]
        BGTaskSchedulerPermittedIdentifiers: [tagwerk.refresh]
        TagwerkAppGroup: group.$(TAGWERK_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TagwerkWidget:
    type: app-extension
    platform: iOS
    sources:
      - TagwerkWidget
      - path: Tagwerk/App/Color+Hex.swift
      - path: Tagwerk/Focus/Shared/FocusActivityAttributes.swift
      - path: Tagwerk/Focus/Shared/FocusActivityIntents.swift
      - path: Tagwerk/Controls/Shared
    dependencies:
      - package: TagwerkCore
    entitlements:
      path: TagwerkWidget/TagwerkWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(TAGWERK_BUNDLE_ID)]
    info:
      path: TagwerkWidget/Info.plist
      properties:
        CFBundleDisplayName: Tagwerk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TagwerkAppGroup: group.$(TAGWERK_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: NO
  TagwerkShare:
    type: app-extension
    platform: iOS
    sources:
      - TagwerkShare
      - Design/Colors.xcassets
      - path: Tagwerk/Common/TextTones.swift
    dependencies:
      - package: TagwerkCore
    entitlements:
      path: TagwerkShare/TagwerkShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(TAGWERK_BUNDLE_ID)]
    info:
      path: TagwerkShare/Info.plist
      properties:
        CFBundleDisplayName: Tagwerk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SafariPreprocessing
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 5
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 5
        TagwerkAppGroup: group.$(TAGWERK_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID).share
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TagwerkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TagwerkTests
      # The rule that confirms audit findings is plain Swift of the UI test target; its unit test runs here, without a simulator app launch.
      - path: TagwerkUITests/AuditConfirmation.swift
      # Same for the geometry rule that ignores contrast findings of content under a system bar.
      - path: TagwerkUITests/SystemBarOverlap.swift
    dependencies:
      - target: Tagwerk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tagwerk.app/Tagwerk"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TagwerkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TagwerkUITests
      - path: Tagwerk/Common/AccessibilityID.swift
    dependencies:
      - target: Tagwerk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Tagwerk
schemes:
  Tagwerk:
    build:
      targets:
        Tagwerk: all
        TagwerkTests: [test]
    test:
      targets:
        - TagwerkTests
        # Tests of the packages that cannot run on macOS (AIKit imports UIKit): one build graph and one DerivedData folder
        # with the app, instead of a separate package build. Keep in sync with PACKAGE_TEST_PLATFORM in test-all.sh.
        - package: AIKit/AIKitTests
      language: de
      region: DE
  TagwerkUITests:
    build:
      targets:
        Tagwerk: all
        TagwerkUITests: [test]
    test:
      targets: [TagwerkUITests]
      language: de
      region: DE
