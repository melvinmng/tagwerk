name: Tagwerk
options:
  bundleIdPrefix: local.tagwerk
  developmentLanguage: de
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    TAGWERK_BUNDLE_ID: local.tagwerk.app
    GITHUB_CLIENT_ID: ""
packages:
  TagwerkCore:
    path: Packages/TagwerkCore
  SecureStore:
    path: Packages/SecureStore
  RemindersKit:
    path: Packages/RemindersKit
  GitHubKit:
    path: Packages/GitHubKit
targets:
  Tagwerk:
    type: application
    platform: iOS
    sources: [Tagwerk]
    dependencies:
      - package: TagwerkCore
      - package: SecureStore
      - package: RemindersKit
      - package: GitHubKit
    info:
      path: Tagwerk/Info.plist
      properties:
        CFBundleDisplayName: Tagwerk
        UILaunchScreen: {}
        NSRemindersFullAccessUsageDescription: "Tagwerk liest und bearbeitet deine Erinnerungen, um sie mit deinen anderen Aufgaben zusammenzuführen."
        NSCalendarsFullAccessUsageDescription: "Tagwerk liest deinen Kalender, um deinen Tag zu planen."
        GitHubClientID: $(GITHUB_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TagwerkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TagwerkTests]
    dependencies:
      - target: Tagwerk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAGWERK_BUNDLE_ID).tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tagwerk.app/Tagwerk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tagwerk:
    build:
      targets:
        Tagwerk: all
        TagwerkTests: [test]
    test:
      targets: [TagwerkTests]
