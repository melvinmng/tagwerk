name: Tests

# Runs the local test script (app/test-all.sh) on a GitHub-hosted macOS runner. CI is the gate before a merge; locally
# only the fast stages and the UI test classes a change touches are run (see README, "Tests auf GitHub Actions").
# Two parallel jobs:
#   fast  package tests, app unit tests and String Catalog check (UI tests skipped)
#   ui    UI tests including the accessibility audits (the slow stage)
# Triggers:
#   pull_request       reduced UI test set (TAGWERK_UI_TEST_SET=pr, see app/TagwerkUITests/nightly-only.txt) with one
#                      retry per failed UI test; retried tests are listed in the job summary
#   schedule           nightly, only when main has new commits since the last successful nightly run; full UI test
#                      set, no retries
#   workflow_dispatch  full UI test set, no retries, for any branch
#   push to main       build only, no tests: refreshes the build caches after every merge (see "Build cache" below)
# A pull request that changes only documentation (docs/**, *.md, TODO.md) runs no tests: the jobs below still start
# and finish green, so the checks stay usable as required status checks. The filter lives in the "changes" job and
# not in on.paths, because a workflow that is never triggered would leave a required check pending forever.
# Build cache: a cold build takes about 34 minutes (ui) and 37 minutes (fast), so DerivedData is cached per job
# (restore always, save only for runs on main, see the cache steps below) and the sources get the modification time of
# their last commit, which lets Xcode skip everything that did not change. Pull requests restore the cache that main
# saved and build only the difference.
# Cache refresh on merge: every push to main (a merged pull request) runs the same two jobs in build-only mode
# (TAGWERK_BUILD_ONLY=1 in app/test-all.sh: xcodebuild build-for-testing instead of xcodebuild test, same schemes,
# destination and DerivedData folders) and saves the cache, so a pull request starts from a cache that is at most one
# merge old instead of one from the last nightly run. No test runs there; the nightly run stays the full test run.
# Pushes that change only documentation (docs/**, *.md) do not start the workflow (paths-ignore on the push trigger);
# the sources, and therefore the cache, are unchanged by them.
# Time zone: the jobs run in Europe/Berlin like the developer machines, because the tests expect German dates and the
# runners use UTC.
# Durations (first run, cold build, runner xcode-27 with 3 cores and 7 GB RAM) and the timeouts derived from them:
#   fast  37 min in total: packages 4.5 + 5.4 + 5.0 + 3.7 + 6.5 min (almost only compiling), app scheme about 10 min
#         -> job 55 min, test step 45 min
#   ui    54 min in total: about 34 min cold build (app and UI test runner), then 20.5 min of UI tests (27 tests, full
#         set, no retries); the pull request set is smaller, but may run retries
#         -> pull request: job 80 min, test step 70 min; nightly and manual (full set): job 90 min, test step 80 min
# The job limit is 10 minutes above the step limit, so the log and artifact upload and the cache save still run when
# the test step hits its limit. A run with a warm cache needs well below these limits; they must also fit a cold run.
# No secrets are used: everything runs in the iOS Simulator without code signing, with demo data only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Nightly, 02:17 UTC (an odd minute avoids the busy start of the hour).
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # A push that changes only documentation leaves the build unchanged, so its cache is still current. Here the filter
    # can live in the trigger (unlike for pull requests, see above): nothing requires a check on a push to main, and
    # GitHub evaluates it over the whole push (all commits of a merge, a rebase or a squash), while a diff of the last
    # commit in the "changes" job could miss earlier commits of the same push. A push that touches any other file
    # (code, project.yml, Package.swift, scripts, this workflow) runs.
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still in progress. A new merge to main cancels the cache
# build of the previous merge: only the newest commit matters for the cache, and its build starts from whatever the
# cancelled build has not saved anyway (a cancelled run saves no cache). Nightly and manual runs of the same kind are
# not cancelled while they run; they run one after another, and a newer waiting run replaces an older waiting one
# (GitHub keeps at most one pending run per concurrency group). Push runs have their own group (the event name is part
# of it), so a cache build never cancels or queues behind a nightly or manual run and the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  # The project is built and tested with exactly this toolchain (see README). The xcode-27 image ships
  # several Xcode 27.x versions and points /Applications/Xcode.app at 27.1, so 27.2 is selected explicitly.
  XCODE_APP: /Applications/Xcode_27.2.app
  XCODE_BUILD_VERSION: 27B52
  SIMULATOR_RUNTIME: iOS 27.2
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  changes:
    name: Changes
    # Decides whether the macOS jobs run any tests. A cheap Linux runner, so no macOS slot is used for the decision.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Two commits are enough to diff a pull request's merge commit against its base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether tests are needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_tests=true
          reason="Tests run."

          case "$EVENT_NAME" in
            schedule)
              # The nightly run skips itself when main has not moved since the last successful nightly run. An early
              # exit is also a successful run, but only for a commit that an earlier successful run has tested.
              last_sha=$(gh api "repos/$REPOSITORY/actions/workflows/tests.yml/runs?event=schedule&status=success&branch=$REF_NAME&per_page=1" \
                --jq '.workflow_runs[0].head_sha // ""')
              if [[ "$last_sha" == "$CURRENT_SHA" ]]; then
                run_tests=false
                reason="Nightly run skipped: no new commits on $REF_NAME since the last successful nightly run ($CURRENT_SHA)."
              else
                reason="Nightly run: $REF_NAME has new commits (last successful nightly run: ${last_sha:-none})."
              fi
              ;;
            push)
              # Documentation-only pushes never get here (paths-ignore on the trigger). The jobs below build only.
              reason="Push to $REF_NAME: build only, refreshes the build caches. No tests run."
              ;;
            pull_request)
              # --no-renames lists both paths of a rename, so moving a file out of a code folder is never "docs only".
              changed_files=$(git diff --name-only --no-renames HEAD^1 HEAD)
              echo "Changed files:"
              echo "$changed_files"
              only_docs=true
              count=0
              while IFS= read -r changed_file; do
                [[ -n "$changed_file" ]] || continue
                count=$((count + 1))
                case "$changed_file" in
                  # TODO.md is covered by *.md.
                  docs/*|*.md) ;;
                  *) only_docs=false ;;
                esac
              done <<<"$changed_files"
              if [[ "$only_docs" == "true" && "$count" -gt 0 ]]; then
                run_tests=false
                reason="Tests skipped: the pull request changes only documentation ($count files: docs/**, *.md, TODO.md)."
              fi
              ;;
            *)
              reason="Manual run: full UI test set."
              ;;
          esac

          echo "$reason"
          {
            echo "run_tests=$run_tests"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "### Changes" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

  tests:
    # A push to main only builds; its name says so. Pull requests, nightly and manual runs keep the name "Tests (...)".
    name: ${{ github.event_name == 'push' && format('Build cache ({0})', matrix.name) || format('Tests ({0})', matrix.name) }}
    needs: changes
    # Xcode-based runner image: macOS 27, Xcode 27.x, Apple silicon only (3 cores, 7 GB RAM on public repositories).
    runs-on: xcode-27
    # Limits from the measured cold run, see the header. The nightly and manual runs use the full UI test set and have
    # their own, higher limits (the fast job is not affected by the test set, so both values are equal there). The
    # build-only run after a merge has no test time, so its limit only has to cover a cold build.
    timeout-minutes: ${{ github.event_name == 'push' && matrix.job_timeout_build || github.event_name == 'pull_request' && matrix.job_timeout || matrix.job_timeout_full }}
    env:
      # The simulator follows the time zone of the host. TZ sets it for the build and for xcodebuild; TEST_RUNNER_TZ
      # is passed (without the prefix) to the test runner process, which xcodebuild does not give other variables.
      TZ: Europe/Berlin
      TEST_RUNNER_TZ: Europe/Berlin
      # Build only (build-for-testing, no tests) for pushes to main, see "Cache refresh on merge" in the header.
      TAGWERK_BUILD_ONLY: ${{ github.event_name == 'push' && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            skip_ui_tests: "1"
            only_ui_tests: ""
            job_timeout: 55
            job_timeout_full: 55
            job_timeout_build: 55
            step_timeout: 45
            step_timeout_full: 45
            step_timeout_build: 45
          - name: ui
            skip_ui_tests: ""
            only_ui_tests: "1"
            job_timeout: 110
            job_timeout_full: 120
            job_timeout_build: 55
            step_timeout: 100
            step_timeout_full: 110
            step_timeout_build: 45

    # Without tests to run (documentation-only pull request, nightly run without new commits) every step except the
    # summary below is skipped and the job still ends green, so "Tests (fast)" and "Tests (ui)" always report a result.
    steps:
      - name: Report skipped tests
        if: needs.changes.outputs.run_tests != 'true'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "### Tests (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the repository
        if: needs.changes.outputs.run_tests == 'true'
        uses: actions/checkout@v7
        with:
          # The full history (about 8 MB) is needed to restore the modification times of the sources.
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the modification times of the sources
        if: needs.changes.outputs.run_tests == 'true'
        # Every checked-out file would otherwise get the current time and be compiled again, cached or not.
        run: /usr/bin/python3 -I scripts/ci-restore-mtimes.py

      - name: Select Xcode and verify the toolchain
        id: toolchain
        if: needs.changes.outputs.run_tests == 'true'
        run: |
          set -euo pipefail
          developer_dir="$XCODE_APP/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::$XCODE_APP is not installed on this runner image. Installed Xcode versions:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$developer_dir"
          # The test scripts export DEVELOPER_DIR from TAGWERK_DEVELOPER_DIR; the rest of the job uses DEVELOPER_DIR.
          {
            echo "TAGWERK_DEVELOPER_DIR=$developer_dir"
            echo "DEVELOPER_DIR=$developer_dir"
          } >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"

          # Output is captured before grep: with pipefail, grep -q closing the pipe early could fail the step.
          xcode_version=$(xcodebuild -version)
          echo "$xcode_version"
          if ! grep -q "Build version $XCODE_BUILD_VERSION" <<<"$xcode_version"; then
            echo "::error::Expected Xcode build $XCODE_BUILD_VERSION (27.2). The runner image has changed."
            exit 1
          fi
          runtimes=$(xcrun simctl list runtimes)
          echo "$runtimes"
          if ! grep -q "$SIMULATOR_RUNTIME " <<<"$runtimes"; then
            echo "::error::The $SIMULATOR_RUNTIME simulator runtime is not installed on this runner image."
            exit 1
          fi
          device_types=$(xcrun simctl list devicetypes)
          if ! grep -q "iPhone 18 Pro (" <<<"$device_types"; then
            echo "::error::The iPhone 18 Pro device type is not available."
            exit 1
          fi
          df -h /

          # The cache key contains the runner image version, so a new image does not reuse an older build.
          echo "image_version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          # The app build folder is fixed, so the cached folder does not depend on the checkout key that
          # scripts/test-env.sh derives from the checkout path. The package stages build in the default
          # DerivedData folder (xcodebuild is called there without -derivedDataPath).
          echo "TAGWERK_TEST_DERIVED_DATA=$HOME/Library/Developer/Tagwerk/DerivedData-ci" >> "$GITHUB_ENV"

      - name: Set the time zone
        if: needs.changes.outputs.run_tests == 'true'
        # TZ and TEST_RUNNER_TZ (job environment) cover the build and the test runner. Setting the system time zone as
        # well is best effort and also covers processes that do not inherit the environment (the app in the UI tests).
        run: |
          sudo systemsetup -settimezone "$TZ" || echo "::warning::Could not set the system time zone; only TZ and TEST_RUNNER_TZ apply."
          echo "System time zone: $(readlink /etc/localtime || echo unknown), TZ=$TZ, now: $(date)"

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        if: needs.changes.outputs.run_tests == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $archive" | shasum -a 256 --check -
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          # The binary reads its setting presets from ../share/xcodegen, so the unpacked layout stays intact.
          echo "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_dir/xcodegen/bin/xcodegen" --version

      - name: Restore the build cache
        id: build_cache
        if: needs.changes.outputs.run_tests == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Developer/Tagwerk/DerivedData-ci
            ~/Library/Developer/Xcode/DerivedData
          # Exact key: toolchain, image, manifests and commit; it never exists for a new commit, so the restore keys
          # below pick the newest cache that main saved: same manifests first, then same image, then same Xcode.
          key: derived-${{ matrix.name }}-${{ env.XCODE_BUILD_VERSION }}-${{ steps.toolchain.outputs.image_version }}-${{ hashFiles('app/project.yml', 'app/Packages/*/Package.swift', 'app/Packages/*/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            derived-${{ matrix.name }}-${{ env.XCODE_BUILD_VERSION }}-${{ steps.toolchain.outputs.image_version }}-${{ hashFiles('app/project.yml', 'app/Packages/*/Package.swift', 'app/Packages/*/Package.resolved') }}-
            derived-${{ matrix.name }}-${{ env.XCODE_BUILD_VERSION }}-${{ steps.toolchain.outputs.image_version }}-
            derived-${{ matrix.name }}-${{ env.XCODE_BUILD_VERSION }}-

      - name: ${{ github.event_name == 'push' && format('Build stages, no tests ({0})', matrix.name) || format('Run test stages ({0})', matrix.name) }}
        id: tests
        if: needs.changes.outputs.run_tests == 'true'
        # Limits the test step below the job timeout, so the artifact upload still runs when the tests hang.
        timeout-minutes: ${{ github.event_name == 'push' && matrix.step_timeout_build || github.event_name == 'pull_request' && matrix.step_timeout || matrix.step_timeout_full }}
        env:
          # The matrix picks the stages for both modes: fast = packages and app scheme, ui = UI test scheme (app and UI test
          # runner). With TAGWERK_BUILD_ONLY (job environment) the stages are built, not tested.
          TAGWERK_SKIP_UI_TESTS: ${{ matrix.skip_ui_tests }}
          TAGWERK_ONLY_UI_TESTS: ${{ matrix.only_ui_tests }}
          # Pull requests run the reduced UI test set with one retry per failed UI test (the unit stages never retry).
          # Nightly and manual runs run every UI test once, so wobbling tests stay visible.
          TAGWERK_UI_TEST_SET: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
          TAGWERK_UI_TEST_RETRIES: ${{ github.event_name == 'pull_request' && '1' || '' }}
          TAGWERK_TEST_LOG_DIR: ${{ runner.temp }}/tagwerk-test-logs
          TAGWERK_TEST_RESULTS_DIR: ${{ runner.temp }}/tagwerk-test-results
        run: app/test-all.sh

      - name: Write job summary
        if: ${{ !cancelled() && needs.changes.outputs.run_tests == 'true' }}
        env:
          JOB_NAME: ${{ matrix.name }}
          JOB_STATUS: ${{ job.status }}
          BUILD_ONLY: ${{ github.event_name == 'push' && '1' || '' }}
          UI_TEST_SET: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
          UI_TEST_RETRIES: ${{ github.event_name == 'pull_request' && '1' || '' }}
          RETRIED_LIST: ${{ runner.temp }}/tagwerk-test-logs/retried-ui-tests.md
          LOG_DIR: ${{ runner.temp }}/tagwerk-test-logs
          CACHE_MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: |
          {
            if [[ -n "$BUILD_ONLY" ]]; then
              echo "### Build cache ($JOB_NAME)"
              echo "Result: $JOB_STATUS (build only, no tests were run)"
            else
              echo "### Tests ($JOB_NAME)"
              echo "Result: $JOB_STATUS"
            fi
            # Shows whether the build cache pays off: which cache was restored and how many compile steps still ran.
            # A warm cache needs few compile steps; a count close to a cold run means the cache did not take effect.
            echo
            echo "Build cache restored: ${CACHE_MATCHED_KEY:-none (cold build)}"
            for folder in "$HOME/Library/Developer/Tagwerk/DerivedData-ci" "$HOME/Library/Developer/Xcode/DerivedData"; do
              if [[ -d "$folder" ]]; then
                echo "- ${folder/#$HOME/~}: $(du -sh "$folder" | cut -f1)"
              fi
            done
            for log in "$LOG_DIR"/*.log; do
              [[ -f "$log" ]] || continue
              compile_steps=$(grep -cE '^(SwiftCompile|CompileSwift|CompileC|SwiftDriver) ' "$log" || true)
              echo "- $(basename "$log" .log): $compile_steps compile steps"
            done
            echo
            if [[ "$JOB_NAME" == "ui" && -z "$BUILD_ONLY" ]]; then
              echo "UI test set: $UI_TEST_SET, retries: ${UI_TEST_RETRIES:-none}"
              if [[ -f "$RETRIED_LIST" ]]; then
                echo
                echo '```'
                cat "$RETRIED_LIST"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs and result bundles
        if: ${{ failure() && needs.changes.outputs.run_tests == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-failure-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/tagwerk-test-logs
            ${{ runner.temp }}/tagwerk-test-results
          if-no-files-found: warn
          retention-days: 7

      # Only runs on main (pushes after a merge, nightly and manual runs) write the cache. A cache written by a pull
      # request is only visible to that pull request, and every push would add another multi-gigabyte entry to the
      # 10 GB limit of the repository, so pull requests only restore the newest cache of main. The cache is also saved
      # after failed tests: the build state is valid, and the UI job would otherwise never save while an audit fails.
      # A build-only run saves the cache with the same key scheme as the test runs (the key has no event or mode part), so
      # pull requests restore it like any other cache of main; the newest one wins.
      - name: Shrink the build cache
        if: ${{ !cancelled() && needs.changes.outputs.run_tests == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          # The index and the logs are not needed to build; they only take space.
          for folder in "$HOME/Library/Developer/Tagwerk/DerivedData-ci" "$HOME/Library/Developer/Xcode/DerivedData"; do
            [[ -d "$folder" ]] || continue
            rm -rf "$folder"/Index.noindex "$folder"/*/Index.noindex "$folder"/Logs "$folder"/*/Logs
            echo "${folder/#$HOME/~}: $(du -sh "$folder" | cut -f1)"
          done

      - name: Save the build cache
        if: ${{ !cancelled() && needs.changes.outputs.run_tests == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Developer/Tagwerk/DerivedData-ci
            ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ matrix.name }}-${{ env.XCODE_BUILD_VERSION }}-${{ steps.toolchain.outputs.image_version }}-${{ hashFiles('app/project.yml', 'app/Packages/*/Package.swift', 'app/Packages/*/Package.resolved') }}-${{ github.sha }}

  prune-caches:
    name: Prune build caches
    needs: tests
    # Keeps the newest two build caches per job on main. Eviction by the 10 GB limit removes the least recently used
    # entries anyway; this keeps the list short and avoids evicting a cache that pull requests still restore.
    # Separate job on a Linux runner, because deleting caches needs the actions: write permission, which the job
    # that builds the code should not have.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete older caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keys look like derived-<job>-<xcode build>-<image>-<hash>-<sha>; the job name is the second field.
          caches=$(gh cache list --repo "$REPOSITORY" --ref refs/heads/main --key derived- --sort created_at --order desc \
            --limit 100 --json id,key)
          stale_ids=$(jq -r 'group_by(.key | split("-")[1]) | map(.[2:]) | flatten | .[].id' <<<"$caches")
          for id in $stale_ids; do
            echo "Deleting cache $id"
            gh cache delete "$id" --repo "$REPOSITORY"
          done
          echo "Kept the newest two caches per job; deleted $(wc -w <<<"$stale_ids") older ones."
